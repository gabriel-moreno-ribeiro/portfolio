    <script>
      // Light by default; dark only when the visitor chose it. Applied before paint to avoid a flash.
      try {
        if (localStorage.getItem("darkMode") === "true") {
          document.documentElement.setAttribute("data-theme", "dark");

    <style>
      /* Inline critical styles to prevent white flash */
      html, body {
        margin: 0;
        background: #fff8f4;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #14100d;
      }
      /* Loading screen: three blocks shuffling under the robot, painted before any
         JS runs. App.tsx slides it away once the app has mounted (gone at 2 s at the earliest). */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff8f4;
        transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1);
      }
      html[data-theme="dark"] #preloader { background: #14100d; }
      #preloader.is-done { transform: translateY(-101%); }
      .pl-stage { position: relative; width: 112px; height: 190px; }
      /* The blocks are SVG rects animated with SMIL: geometry changes inside an
         <svg> are not layout shifts, so the loader never counts against CLS. */
      .pl-boxes { position: absolute; left: 0; bottom: 0; width: 112px; height: 112px; display: block; }
      .pl-boxes rect { fill: none; stroke: #111; stroke-width: 16; }
      html[data-theme="dark"] .pl-boxes rect { stroke: #fff; }
      .pl-robot {
        position: absolute;
        left: 50%;
        bottom: 102px;
        width: 84px;
        height: 84px;
        margin-left: -42px;
        transform-origin: 50% 88%;
        animation: pl-hop 1.3s ease-in-out infinite;
      }
      @keyframes pl-hop {
        0%   { transform: translateY(0) scale(1.06, 0.94); }
        35%  { transform: translateY(-10px) scale(0.98, 1.03); }
        65%  { transform: translateY(0) scale(1, 1); }
        100% { transform: translateY(0) scale(1.06, 0.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader { display: none; }
      }
    </style>
