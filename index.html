    <style>
      /* Inline critical styles to prevent white flash */
      html, body {
        margin: 0;
        background: #fff8f4;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background: #14100d;
      }
      /* Loading screen: three blocks shuffling under the robot, painted before any
         JS runs. App.tsx slides it away once the app has mounted (after 1.7 s at least). */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff8f4;
        transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1);
      }
      html[data-theme="dark"] #preloader { background: #14100d; }
      #preloader.is-done { transform: translateY(-101%); }
      .pl-stage { position: relative; width: 112px; height: 190px; }
      .pl-boxes { position: absolute; left: 0; bottom: 0; width: 112px; height: 112px; }
      .pl-box {
        position: absolute;
        box-sizing: border-box;
        border: 16px solid #111;
        animation: 4s ease-in-out infinite;
      }
      html[data-theme="dark"] .pl-box { border-color: #fff; }
      .pl-box:nth-child(1) { width: 112px; height: 48px; margin-top: 64px; animation-name: pl-box1; }
      .pl-box:nth-child(2) { width: 48px; height: 48px; animation-name: pl-box2; }
      .pl-box:nth-child(3) { width: 48px; height: 48px; margin-left: 64px; animation-name: pl-box3; }
      .pl-robot {
        position: absolute;
        left: 50%;
        bottom: 102px;
        width: 84px;
        height: 84px;
        margin-left: -42px;
        transform-origin: 50% 88%;
        animation: pl-hop 1.3s ease-in-out infinite;
      }
      @keyframes pl-hop {
        0%   { transform: translateY(0) scale(1.06, 0.94); }
        35%  { transform: translateY(-10px) scale(0.98, 1.03); }
        65%  { transform: translateY(0) scale(1, 1); }
        100% { transform: translateY(0) scale(1.06, 0.94); }
      }
      @keyframes pl-box1 {
        0%          { width: 112px; height: 48px; margin-top: 64px; margin-left: 0; }
        12.5%, 62.5% { width: 48px; height: 48px; margin-top: 64px; margin-left: 0; }
        75%         { width: 48px; height: 112px; margin-top: 0; margin-left: 0; }
        87.5%, 100% { width: 48px; height: 48px; margin-top: 0; margin-left: 0; }
      }
      @keyframes pl-box2 {
        0%, 37.5%   { width: 48px; height: 48px; margin-top: 0; margin-left: 0; }
        50%         { width: 112px; height: 48px; margin-top: 0; margin-left: 0; }
        62.5%, 100% { width: 48px; height: 48px; margin-top: 0; margin-left: 64px; }
      }
      @keyframes pl-box3 {
        0%, 12.5%   { width: 48px; height: 48px; margin-top: 0; margin-left: 64px; }
        25%         { width: 48px; height: 112px; margin-top: 0; margin-left: 64px; }
        37.5%, 87.5% { width: 48px; height: 48px; margin-top: 64px; margin-left: 64px; }
        100%        { width: 112px; height: 48px; margin-top: 64px; margin-left: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader { display: none; }
      }
    </style>
