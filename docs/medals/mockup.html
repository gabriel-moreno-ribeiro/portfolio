<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medal Wall mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff8f4; --surface:#fff; --fg:#111; --fg-muted:#5f5f5f; --border:#e7e7e7; --accent:#b8501a; --accent-decor:#f0732d; --font-serif:"DM Serif Display",Georgia,serif; }
  [data-theme="dark"] { --bg:#0a0a1a; --surface:#16162e; --fg:#fff; --fg-muted:#a8a8b8; --border:rgba(255,255,255,.14); --accent:#f0732d; --accent-decor:#f0732d; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"DM Sans",system-ui,sans-serif; }
  .wall { max-width:1100px; margin:0 auto; padding:72px 24px 80px; }
  .section-title { text-align:center; font-size:44px; font-weight:700; letter-spacing:-.02em; margin:0; }
  .section-title em { font-family:var(--font-serif); font-style:italic; font-weight:400; color:var(--accent-decor); }
  .wall__eyebrow { display:flex; justify-content:center; align-items:center; gap:12px; margin:14px 0 34px; font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--fg-muted); }
  .wall__eyebrow i { width:22px; height:1px; background:var(--accent-decor); }
  .wall__grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:auto; grid-auto-flow:dense; gap:14px; }
  .tile { position:relative; min-width:0; aspect-ratio:1; border:1px solid var(--border); border-radius:14px; background:var(--surface); display:flex; align-items:center; justify-content:center; padding:12%; transition:transform .35s cubic-bezier(.22,1,.36,1), border-color .2s; }
  .tile:hover { transform:translateY(-4px) scale(1.03); border-color:var(--accent-decor); z-index:2; }
  .tile svg { width:100%; height:100%; display:block; }
  .tile__cap { position:absolute; left:8px; right:8px; bottom:8px; font-size:10.5px; font-weight:600; letter-spacing:.02em; color:var(--fg-muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:opacity .2s; }
  .tile:hover .tile__cap { opacity:1; }
  .tile--show .tile__cap { opacity:1; }
  .center { grid-column:3/6; grid-row:3/6; aspect-ratio:auto; padding:10px; overflow:hidden; flex-direction:column; gap:0; }
  .center .photo { width:100%; flex:1; min-height:0; border-radius:8px; background:linear-gradient(160deg,#d9c6b6,#8a6a55 60%,#3b2a22); position:relative; overflow:hidden; }
  .center .photo::after { content:"Foto: eu segurando as medalhas"; position:absolute; inset:auto 0 0 0; padding:10px; font-size:12px; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.55)); }
  .center .plate { flex:0 0 34px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px 10px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-muted); }
  .center .plate b { color:var(--accent); }
  .plaque { flex-direction:column; gap:4px; padding:10px; text-align:center; }
  .plaque strong { font-size:28px; line-height:1; letter-spacing:-.02em; }
  .plaque span { font-size:11px; color:var(--fg-muted); line-height:1.3; }
  @media (max-width:700px) {
    .wall { padding:48px 16px 56px; }
    .section-title { font-size:32px; }
    .wall__grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .center { grid-column:1/4; grid-row:1/4; aspect-ratio:1; }
    .center .plate { font-size:10px; letter-spacing:.1em; }
    .wall__eyebrow { display:none; }
    .tile { border-radius:12px; }
  }
</style>
</head>
<body>
<section class="wall" aria-label="Medal wall">
  <h2 class="section-title">The medal <em>wall</em></h2>
  <p class="wall__eyebrow"><span>2021 — 2025</span><i></i><span>49 competitions</span><i></i><span>39 medals</span><i></i><span>19 gold</span></p>
  <div class="wall__grid" id="grid">
    <div class="tile center">
      <div class="photo"></div>
      <div class="plate"><b>39</b> medals <i style="width:3px;height:3px;border-radius:50%;background:currentColor"></i> <b>19</b> gold <i style="width:3px;height:3px;border-radius:50%;background:currentColor"></i> <b>2</b> international</div>
    </div>
  </div>
</section>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  const showCaps = q.get('caps') === '1';
  const names = ['ONNEQ','OBQ Jr.','OBQ','OBMEP','MSF','MSF','OBFEP','OBB','ONC','ONEE','ONEE','OBF','OBA','OBM','OBMEP','OBF','OBQ','OBA','ONC','OBB','OBFEP','OBF','OBM','OBA','OBQ','OBMEP','OBF','OBA','OBM','ONEE','OBB','OBF','OBQ','OBA','ONC','OBM','OBF','OBQ','OBA'];
  const kinds = ['gold','gold','bronze','silver','gold','gold','gold','gold','gold','gold','gold','silver','bronze','silver','silver','gold','bronze','silver','gold','gold','gold','silver','bronze','silver','silver','bronze','gold','silver','bronze','gold','silver','bronze','silver','gold','silver','bronze','gold','silver','bronze'];
  const ribbons = [['#1f3a93','#e63946'],['#0b6e4f','#f4d35e'],['#7b2cbf','#ffffff'],['#e63946','#ffffff'],['#1f3a93','#ffffff'],['#f4a261','#264653'],['#2a9d8f','#e9c46a'],['#111','#f0732d']];
  const metal = { gold:['#fff1b8','#e2b53a','#9a6d12'], silver:['#ffffff','#c9cdd3','#7c828a'], bronze:['#f2c9a8','#b5733a','#5a3315'] };
  const grid = document.getElementById('grid');
  const years = [2021,2022,2023,2024,2025];
  names.forEach((n,i)=>{
    const k = kinds[i]; const [hi,mid,lo] = metal[k]; const [r1,r2] = ribbons[i%ribbons.length];
    const el = document.createElement('div');
    el.className = 'tile' + (showCaps ? ' tile--show' : '');
    el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="g${i}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${hi}"/><stop offset=".55" stop-color="${mid}"/><stop offset="1" stop-color="${lo}"/></radialGradient></defs>
      <path d="M38 0 L50 34 L62 0 Z" fill="${r1}"/><path d="M42 0 L50 24 L58 0 Z" fill="${r2}"/>
      <circle cx="50" cy="60" r="31" fill="url(#g${i})" stroke="${lo}" stroke-width="1.5"/>
      <circle cx="50" cy="60" r="23" fill="none" stroke="${lo}" stroke-opacity=".45" stroke-width="1"/>
      <text x="50" y="65" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="${lo}" fill-opacity=".8">${n}</text>
    </svg><span class="tile__cap">${n} · ${years[i%5]} · ${k}</span>`;
    grid.appendChild(el);
  });
  // one plaque fills the last free cell
  const p = document.createElement('div'); p.className='tile plaque';
  p.innerHTML = '<strong>49</strong><span>competitions<br>2021 – 2025</span>';
  grid.appendChild(p);
</script>
</body>
</html>
