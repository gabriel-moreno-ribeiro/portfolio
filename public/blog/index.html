<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Gabriel Moreno Ribeiro</title>
  <meta name="description" content="Writing by Gabriel Moreno Ribeiro — founder of HIBEEX, olympiad medalist, on a build year. Essays on building, AI, and science." />
  <link rel="canonical" href="https://gabrielmr.com/blog/" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { --orange: #f0732d; --bg: #fff8f4; --text: #1a1a1a; --grey: #6b6b6b; }
    * { margin: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    nav { display: flex; gap: 24px; margin-bottom: 64px; font-size: 15px; }
    nav a { color: var(--grey); text-decoration: none; }
    nav a:hover, nav a.active { color: var(--orange); }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 48px; font-weight: 400; margin-bottom: 12px; }
    h1 em { color: var(--orange); }
    .sub { color: var(--grey); margin-bottom: 56px; }
    .card { border: 1px solid #e8ddd4; border-radius: 16px; padding: 32px; margin-bottom: 20px; }
    .card h2 { font-size: 20px; margin-bottom: 8px; }
    .card p { color: var(--grey); font-size: 15px; line-height: 1.6; }
    .soon { border-style: dashed; text-align: center; color: var(--grey); }
    .back { display: inline-block; margin-top: 40px; color: var(--orange); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/">Portfolio</a>
      <a href="/blog/" class="active">Blog</a>
      <a href="/news/">News</a>

    <p class="sub">Essays on building HIBEEX, AI, science olympiads, and whatever else keeps me up at night.</p>
    <div class="card soon">
      <h2>First posts coming soon</h2>
      <p>I'm busy shipping — but the writing is on its way. Meanwhile, check out the <a href="/" style="color: var(--orange)">portfolio</a> or find me on <a href="https://linkedin.com/in/gabriel-moreno-ribeiro" style="color: var(--orange)">LinkedIn</a>.</p>
    </div>
    <a class="back" href="/">&larr; Back to portfolio</a>
  </div>
</body>
</html>
