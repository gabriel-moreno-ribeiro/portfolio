  <style>
    :root {
      --bg: #fff8f4; --fg: #111; --fg-muted: #5f5f5f;
      --accent: #b8501a; --accent-decor: #f0732d;
      --border: #e7e7e7; --surface: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a1a; --fg: #ffffff; --fg-muted: #a8a8b8;
        --accent: #f0732d; --border: rgba(255,255,255,0.14); --surface: #16162e;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: "DM Sans", system-ui, sans-serif;
      min-height: 100vh;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    nav { display: flex; gap: 24px; margin-bottom: 64px; font-size: 15px; align-items: center; }
    nav a { color: var(--fg-muted); text-decoration: none; transition: color 0.15s; }
    nav a:hover, nav a.active { color: var(--accent); }
    nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .home-link { font-weight: 700; color: var(--fg) !important; }
    h1 { font-family: "DM Serif Display", Georgia, serif; font-size: clamp(32px, 7vw, 52px); font-weight: 400; margin-bottom: 12px; }
    h1 em { color: var(--accent-decor); font-style: italic; }
    .sub { color: var(--fg-muted); margin-bottom: 56px; font-size: 1rem; line-height: 1.6; }
    .card { border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 20px; background: var(--surface); }
    .card h2 { font-size: 1.2rem; margin-bottom: 8px; }
    .card p { color: var(--fg-muted); font-size: 0.95rem; line-height: 1.6; }
    .link { color: var(--accent); }
    .back { display: inline-block; margin-top: 40px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .back:hover { text-decoration: underline; }
  </style>
