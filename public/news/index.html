    .card h2 { font-size: 20px; margin-bottom: 8px; }
    .card p { color: var(--grey); font-size: 15px; line-height: 1.6; }
    .card a { color: var(--orange); text-decoration: none; font-weight: 600; }
    .back { display: inline-block; margin-top: 40px; color: var(--orange); text-decoration: none; font-weight: 600; }
