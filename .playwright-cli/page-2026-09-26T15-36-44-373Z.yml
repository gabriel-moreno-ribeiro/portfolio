            - heading "My grandfather's garage." [level=3] [ref=f22e137]
            - paragraph [ref=f22e138]: The Cariri valley, in the countryside of Ceará. Waterfalls cut through the rock, Padre Cícero's statue watches from the hill, and everyone knows your name before you say it.
            - paragraph [ref=f22e139]: My grandparents built their lives here and my father grew up on these streets. I came back every summer, months of 40°C heat, most of them spent handing my grandfather tools in his garage.
            - paragraph [ref=f22e140]: It's not on any startup map. It's where I learned to open things that won't start.
