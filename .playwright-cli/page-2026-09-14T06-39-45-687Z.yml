          - heading "Why" [level=2] [ref=f2e41]
          - paragraph [ref=f2e42]: I won a gold medal at OBFEP, the physics olympiad for public schools. I put the prize money into building physics kits and took them to public schools in Salvador.
          - paragraph [ref=f2e43]: Most of those schools teach physics without a lab. The kit is an attempt to fix that for the price of a box of parts.
        - generic [ref=f2e44]:
          - heading "The kit" [level=2] [ref=f2e45]
          - paragraph [ref=f2e46]: "A wooden box built to be carried between classrooms and stored in a cupboard. Inside: a caliper, a spring scale, a stopwatch, a measuring tape, weights, a graduated cylinder, and the parts for five experiments."
          - paragraph [ref=f2e47]: Nothing in it needs a technician, a power outlet, or a part that has to be ordered from out of state.
        - generic [ref=f2e48]:
          - heading "What happened" [level=2] [ref=f2e49]
          - paragraph [ref=f2e50]: 3,392 students in 28 public schools have used the kits. In the classrooms that ran them, physics failure rates went from 30% to 10%.
          - paragraph [ref=f2e51]: The work was advised by Coronel Iran Domingues Machado. The write-up is below.
        - link "Read the paper (PDF)" [ref=f2e53] [cursor=pointer]:
          - /url: /research/projeto-candela/paper.pdf
